{% extends "notifications/email/email_shell.html" %}
{% block email_body %}
  <h2>{{ title }}</h2>
  <p>{{ message }}</p>
  <p>This is a friendly reminder that <strong>{{ context.assignment_title }}</strong> is due {{ context.due_date|date:"M d, H:i" }}.</p>
  {% if link %}<p><a class="btn" href="{{ link }}" style="color:#000">Submit Now</a></p>{% endif %}
{% endblock %}
