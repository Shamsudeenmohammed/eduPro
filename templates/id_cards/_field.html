<div class="form-group" style="margin:0{% if field.name == 'is_default' or field.name == 'show_signature_line' %};align-self:end{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span style="color:var(--rose)">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<div style="font-size:11px;color:var(--tx3);margin-top:4px">{{ field.help_text }}</div>{% endif %}
  {% if field.errors %}<div style="color:var(--rose);font-size:11.5px;margin-top:4px">{{ field.errors|striptags }}</div>{% endif %}
</div>
